<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter Básico</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #007bff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Tela de Configuração --- */
        #setup-view {
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
        }

        textarea {
            flex-grow: 1;
            background-color: #1a1a1a;
            color: var(--text-color);
            border: 2px solid #333;
            padding: 20px;
            font-size: 1.2rem;
            resize: none;
            margin-bottom: 20px;
            border-radius: 12px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 18px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* --- Tela do Prompter --- */
        #prompter-view {
            display: none;
            flex-direction: column;
            position: relative;
        }

        #prompter-text {
            flex-grow: 1;
            overflow-y: auto; /* Permite rolar com o dedo se o texto for muito longo */
            padding: 10px 20px 80px 20px;
            /* Texto responsivo: cresce de acordo com a tela, mas tem um limite mínimo e máximo */
            font-size: clamp(2.5rem, 6vw, 6rem); 
            line-height: 1.5;
            font-weight: bold;
            white-space: pre-wrap; /* Mantém as quebras de linha que você digitou */
            text-align: left;
        }

        /* Esconde a barra de rolagem para ficar mais limpo, mas ainda permite rolar */
        #prompter-text::-webkit-scrollbar {
            display: none;
        }
        #prompter-text {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #back-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            opacity: 0.6;
        }

        #back-btn:hover {
            opacity: 1;
            background-color: #444;
        }
    </style>
</head>
<body>

    <!-- Tela 1: Colar o Texto -->
    <div id="setup-view" class="container">
        <h2>Cole seu roteiro abaixo</h2>
        <textarea id="script-input" placeholder="Cole seu texto aqui..."></textarea>
        <button onclick="startPrompter()">Mostrar Texto</button>
    </div>

    <!-- Tela 2: O Prompter -->
    <div id="prompter-view" class="container">
        <div id="prompter-text"></div>
        <button id="back-btn" onclick="stopPrompter()">Voltar e Editar</button>
    </div>

    <script>
        function startPrompter() {
            const text = document.getElementById('script-input').value;
            if (!text.trim()) {
                alert('Por favor, cole algum texto primeiro.');
                return;
            }
            
            // Coloca o texto na tela do prompter
            document.getElementById('prompter-text').textContent = text;
            
            // Troca as telas
            document.getElementById('setup-view').style.display = 'none';
            document.getElementById('prompter-view').style.display = 'flex';
        }

        function stopPrompter() {
            // Volta para a tela inicial
            document.getElementById('setup-view').style.display = 'flex';
            document.getElementById('prompter-view').style.display = 'none';
        }
    </script>
</body>
</html>
