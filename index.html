<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter Básico</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #007bff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Tela de Configuração --- */
        #setup-view {
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
        }

        textarea {
            flex-grow: 1;
            background-color: #1a1a1a;
            color: var(--text-color);
            border: 2px solid #333;
            padding: 20px;
            font-size: 1.2rem;
            resize: none;
            margin-bottom: 20px;
            border-radius: 12px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 18px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* --- Tela do Prompter --- */
        #prompter-view {
            display: none;
            flex-direction: column;
            position: relative;
        }

        #prompter-text {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 20px 80px 20px;
            font-size: clamp(2.5rem, 6vw, 6rem); 
            line-height: 1.5;
            font-weight: bold;
            white-space: pre-wrap;
            text-align: left;
        }

        #prompter-text::-webkit-scrollbar {
            display: none;
        }
        #prompter-text {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Controles flutuantes */
        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .float-btn {
            background-color: #333;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            opacity: 0.3; /* Bem transparente para não atrapalhar a leitura */
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .float-btn:hover {
            opacity: 1;
            background-color: #444;
            transform: scale(1.05);
        }
        
        #fullscreen-btn {
            background-color: #28a745;
        }
        #fullscreen-btn:hover {
            background-color: #218838;
        }

    </style>
</head>
<body>

    <!-- Tela 1: Colar o Texto -->
    <div id="setup-view" class="container">
        <h2>Cole seu roteiro abaixo</h2>
        <textarea id="script-input" placeholder="Cole seu texto aqui..."></textarea>
        <button onclick="startPrompter()">Mostrar Texto</button>
    </div>

    <!-- Tela 2: O Prompter -->
    <div id="prompter-view" class="container">
        <div id="prompter-text"></div>
        <div id="controls">
            <button id="fullscreen-btn" class="float-btn" onclick="toggleFullScreen()">⛶ Tela Cheia / Horizontal</button>
            <button id="back-btn" class="float-btn" onclick="stopPrompter()">Voltar</button>
        </div>
    </div>

    <script>
        function startPrompter() {
            const text = document.getElementById('script-input').value;
            if (!text.trim()) {
                alert('Por favor, cole algum texto primeiro.');
                return;
            }
            
            document.getElementById('prompter-text').textContent = text;
            
            document.getElementById('setup-view').style.display = 'none';
            document.getElementById('prompter-view').style.display = 'flex';
        }

        function stopPrompter() {
            // Se estiver em tela cheia, sai ao voltar
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(err => console.log(err));
            }
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }

            document.getElementById('setup-view').style.display = 'flex';
            document.getElementById('prompter-view').style.display = 'none';
        }

        async function toggleFullScreen() {
            const doc = document.documentElement;
            
            if (!document.fullscreenElement) {
                try {
                    // 1. Pede tela cheia (com suporte a vários navegadores)
                    if (doc.requestFullscreen) {
                        await doc.requestFullscreen();
                    } else if (doc.webkitRequestFullscreen) { /* Safari */
                        await doc.webkitRequestFullscreen();
                    } else if (doc.msRequestFullscreen) { /* IE11 */
                        await doc.msRequestFullscreen();
                    }

                    // 2. Força o celular a deitar a tela (Modo Paisagem)
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock("landscape").catch(err => {
                            console.log("Bloqueio de orientação automática não suportado: ", err);
                        });
                    }
                    
                    document.getElementById('fullscreen-btn').textContent = '✖ Sair da Tela Cheia';
                } catch (err) {
                    console.log(`Erro ao tentar tela cheia: ${err.message}`);
                }
            } else {
                // Sai da tela cheia
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
                
                // Destrava a orientação
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
                
                document.getElementById('fullscreen-btn').textContent = '⛶ Tela Cheia / Horizontal';
            }
        }
        
        // Se o usuário sair da tela cheia pelo botão "Voltar" do celular ou "ESC", atualiza o botão
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('fullscreen-btn').textContent = '⛶ Tela Cheia / Horizontal';
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });
    </script>
</body>
</html>
